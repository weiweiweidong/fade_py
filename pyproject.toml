[project]
name = "fade"
version = "0.1.0"
description = "FADE fog density estimation — vectorized implementation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fade"]

[project.optional-dependencies]
demo = [
    "matplotlib>=3.9",
    "ipykernel>=7.2.0",
    "pillow>=10.0",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pillow>=10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: tests that load real disk images (deselect with -m 'not slow')",
]

[tool.coverage.run]
source = ["src/fade"]

[tool.coverage.report]
show_missing = true
